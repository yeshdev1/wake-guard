name: WakeGuard

# WG-003: repository structure and Xcode project.
# XcodeGen is the source of truth; the generated *.xcodeproj is git-ignored and
# produced with `xcodegen generate` (see Makefile / README). This keeps the
# project definition reviewable and free of pbxproj merge churn.

options:
  bundleIdPrefix: com.wakeguard
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"               # Swift 6 language mode (ADR-001 / CLAUDE.md)
    SWIFT_STRICT_CONCURRENCY: complete # deliberate actor isolation (CLAUDE.md)
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES   # WG-004: build fails on warnings (CLAUDE.md)
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  WakeGuard:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources           # single app target, feature folders (ADR-003)
      - path: PrivacyInfo.xcprivacy   # Apple privacy manifest (WG-186), bundled as a resource
      - path: Localizable.xcstrings   # String Catalog (WG-206); Xcode extracts LocalizedStringKeys
    entitlements:
      path: WakeGuard.entitlements
      properties:
        # HealthKit read access (WG-121). Read-only; the app never writes (toShare: []). Required for
        # real on-device authorization/queries; without it the request fails closed to .restricted and
        # the app stays functional (health is optional, #36/#38).
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakeguard.app
        PRODUCT_NAME: WakeGuard
        # The user-facing product name (home screen, app switcher, Settings, App Store listing).
        # Verified available: no exact "Alarm Agent" match on the US/IN/GB storefronts (2026-08-14);
        # definitive reservation happens when the App Store Connect record is created. The internal
        # module/code name stays WakeGuard (codename ≠ marketing name).
        INFOPLIST_KEY_CFBundleDisplayName: "Alarm Agent"
        # Explicit release version + build number (WG-260). MARKETING_VERSION is the user-facing
        # version; CURRENT_PROJECT_VERSION is the build number the TestFlight pipeline bumps per
        # upload (`make archive BUILD=<n>` overrides it). Explicit values make the archive's build
        # metadata reproducible instead of defaulting to 1.0/1.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # AlarmKit's iOS-26 usage string lives in this explicit plist (merged into the generated one)
        # because Xcode's build system drops INFOPLIST_KEY_NSAlarmKitUsageDescription — see the file.
        INFOPLIST_FILE: WakeGuard-Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Purpose strings for the device capabilities the shipped features touch (AlarmKit for ringing;
        # Core Motion for the walk challenge + pre-alarm awake check; Core Location for low-power travel
        # detection). Required before the app touches each framework — a missing key is a launch crash /
        # App Review rejection. Each names the specific use and minimizes/disclaims data (#41).
        # NSAlarmKitUsageDescription is set in WakeGuard-Info.plist (Xcode drops the INFOPLIST_KEY_ form).
        INFOPLIST_KEY_NSMotionUsageDescription: "Alarm Agent uses step and motion data only to run the wake-up walk challenge and to check whether you're already up just before an alarm. It never uses your location and never reads your saved workouts or health records."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Alarm Agent checks your approximate location only to notice when you've travelled to a new time zone, so it can keep your alarms correct. It uses low-power location (significant changes only), never continuous GPS, and never stores where you are."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Alarm Agent reads your recent sleep from Health only to estimate your sleep duration and consistency and explain your morning readiness — on your device, never stored raw or sent to the cloud. It's optional, and it's a sleep estimate, never a diagnosis."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Alarm Agent reads your upcoming events only to work out the latest time you can safely wake up and still be ready. It uses only event times — your event titles stay on your device, are never sent anywhere, and are never used by the assistant."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  WakeGuardTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests             # WakeGuardTests + TestSupport (fakes land in WG-007)
    dependencies:
      - target: WakeGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakeguard.tests
        GENERATE_INFOPLIST_FILE: YES

  # WG-050: XCUITest bundle driving the app through its accessibility identifiers. Kept out of
  # the WakeGuard scheme's `test` set so the fast unit gate (ci-fast) stays quick; run via the
  # WakeGuardUITests scheme (`make test-ui`).
  WakeGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: WakeGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakeguard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WakeGuard

schemes:
  WakeGuard:
    build:
      targets:
        WakeGuard: all
        WakeGuardTests: [test]
    test:
      targets:
        - WakeGuardTests
  WakeGuardUITests:
    build:
      targets:
        WakeGuard: all
        WakeGuardUITests: [test]
    test:
      targets:
        - WakeGuardUITests
